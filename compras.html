<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compra de Café</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  body{
    background-color: #FFFAF0; /* crema como blanca */
    font-family: Arial, sans-serif;
    color: #3E2723;
  }
  /* BARRA DE NAVEGACION */
  nav{
    background: #D5E8D4; /* verde más pálido */
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top:0;
  }
  nav .logo{
    font-weight: bold;
    font-size: 20px;
    color: #3E2723;
  }
  nav a{
    color: #3E2723;
    text-decoration: none;
    margin-left: 20px;
    font-weight: 700;
  }
  nav a:hover{
    color: #722F37;
    border-bottom: 2px solid #722F37;
  }

  /* SECCION TIPOS */
  .seccion-cafe{
    padding: 60px 20px;
    text-align: center;
  }
  .seccion-cafe h1{
    font-size: 32px;
    margin-bottom: 40px;
  }
  .contenedor-tarjetas{
    display: flex;
    gap: 25px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 1100px;
    margin: 0 auto;
  }
  .tarjeta{
    background: white;
    width: 300px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    border: 2px solid #D9B18E; /* borde piel */
    transition: transform 0.2s;
  }
  .tarjeta:hover{
    transform: translateY(-5px);
  }
  .tarjeta img{
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #F5EFE6; /* mientras cargas tu foto */
  }
  .tarjeta h3{
    padding: 18px;
    font-size: 20px;
  }
  /* BOTON OVALADO */
  .btn-contacto{
    display: inline-block;
    margin-top: 50px;
    background: #D9B18E; /* piel */
    color: #3E2723;
    padding: 16px 45px;
    border-radius: 50px; /* ovalado como tu dibujo */
    text-decoration: none;
    font-weight: bold;
    border: 2px solid #3E2723;
  }
  .btn-contacto:hover{
    background: #3E2723;
    color: #FFFAF0;
  }

  .titulo-proceso{
  text-align:center; font-size:22px; color:#3E2723; 
  font-weight:bold; margin:20px 0; border:2px solid #d7c4a5;
  padding:10px; border-radius:10px; background:white;
}
.contenedor-proceso{
  max-width:900px; margin:auto; background:white;
  border:2px solid #d7c4a5; border-radius:15px; padding:20px;
}
.fila{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:15px; flex-wrap:wrap;
}
.tarjeta{
  width:140px; text-align:center; background:#fff;
  border:1px solid #e0d0b8; border-radius:12px;
  padding:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.tarjeta .foto{
  width:100%; height:100px; background:#f5f0e8;
  border-radius:8px; display:flex; align-items:center;
  justify-content:center; overflow:hidden; border:1px dashed #c9b896;
}
.tarjeta .foto img{ width:100%; height:100%; object-fit:cover; }
.tarjeta .nombre{
  margin-top:6px; font-size:11px; font-weight:bold;
  background:#f5f0e8; border:1px solid #d7c4a5;
  border-radius:20px; padding:3px 6px; color:#3E2723;
}
.tarjeta .nombre::before{ content:"• "; color:#7bb342; }
.flecha{ font-size:24px; color:#7bb342; font-weight:bold; }
.flecha-abajo{ text-align:center; font-size:28px; color:#7bb342; margin:5px 0; }
.fila-centro{ justify-content:center; }

@media(max-width:600px){
  .fila{ flex-direction:column; }
  .flecha{ transform:rotate(90deg); }
  .fila.fila-2{ flex-direction:column-reverse; }
}

</style>
</head>
<body>

<nav>
  <div class="logo">Compras </div>

     <div class="flecha">→</div>

<div style="width:100%; display:flex; justify-content:center; margin: 50px 0 40px 0;">
